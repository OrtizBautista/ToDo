<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Polenta</title>
  <link rel="stylesheet" href="style.css">
  <link rel="shortcut icon" href="./assets/favicon.png" type="image/png">
</head>
<body>
  <div id="caja">
    <!-- LOGIN / REGISTRO -->
    <div id="login-register">
      <h2>INICIAR SESIÓN / REGISTRARSE</h2>

      <!-- Login tradicional -->
      <input type="text" id="usuario" placeholder="Usuario"><br>
      <input type="password" id="password" placeholder="Contraseña"><br>
      <button id="btnRegistrar">Registrarse</button>
      <button id="btnLogin">Iniciar Sesión</button>

      <!-- Login con Google -->
      <button id="loginGoogle">Iniciar sesión con Google</button>

      <p id="mensaje"></p>
    </div>

    <!-- TO-DO LIST -->
    <div id="todo-list" style="display:none;">
      <h2>Bienvenido, <span id="nombreUsuario"></span></h2>
      <div id="todo">
        <h3>📝 Lista de Tareas</h3>
        <input type="text" id="nuevaTarea" placeholder="Escribí una tarea">
        <button id="btnAgregar">Agregar</button>

        <p id="contadorTareas"></p>
        <ul id="listaTareas"></ul>

        <button id="btnBorrarTodo">Borrar todo</button>
        <button id="btnCerrarSesion">Cerrar Sesión</button>
      </div>
    </div>
  </div>

  <!-- Script separado como módulo -->
  <script type="module" src="script.js"></script>
</body>
</html>
